<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#141c26;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8da1b9;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#141c26" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Fondo cuadrado redondeado -->
    <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

    <!-- Elemento decorativo de fondo -->
    <circle cx="256" cy="256" r="160" fill="#ef959c" opacity="0.15"/>

    <!-- Forma de documento/portapapeles -->
    <rect x="136" y="120" width="240" height="272" rx="24" ry="24" fill="#f7f0ee"/>

    <!-- Anillas superiores del documento -->
    <rect x="176" y="96" width="24" height="48" rx="12" ry="12" fill="#dbc7be"/>
    <rect x="312" y="96" width="24" height="48" rx="12" ry="12" fill="#dbc7be"/>

    <!-- Líneas de contenido (simulando lista de comprobación) -->
    <rect x="168" y="192" width="176" height="16" rx="8" ry="8" fill="#8da1b9" opacity="0.8"/>
    <rect x="168" y="232" width="128" height="16" rx="8" ry="8" fill="#95adb6" opacity="0.9"/>
    <rect x="168" y="272" width="160" height="16" rx="8" ry="8" fill="#95adb6" opacity="0.6"/>

    <!-- Distintivo de calidad (check) en la esquina inferior derecha -->
    <circle cx="340" cy="340" r="44" fill="#141c26"/>
    <path d="M320 340 L336 356 L364 324" stroke="#f7f0ee" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Detalle sutil de acento -->
    <rect x="136" y="160" width="240" height="8" rx="4" ry="4" fill="#8da1b9" opacity="0.3"/>
</svg>
