; PHP runtime configuration for ÁTICA Calidad (Windows / FrankenPHP)
extension_dir = ext

extension = openssl
extension = intl
extension = pdo_sqlite
extension = sqlite3
extension = mbstring
extension = zip

; Document/submission uploads accept files up to 20 MB each, and a batch
; submission can include several at once: post_max_size must cover the sum,
; not just one file (if exceeded, PHP silently discards the whole request
; body, CSRF token included). Without this, PHP's defaults (2M/8M) fall well
; below the application's own per-file limit.
upload_max_filesize = 20M
post_max_size        = 128M
