framework:
    workflows:
        # Life cycle of a finding (incident, nonconformity, observation or improvement opportunity).
        # The marking is the App\Entity\FindingStatus enum; who may take each step, and when, is
        # decided by App\EventSubscriber\FindingWorkflowSubscriber (guards), which also writes the
        # timeline, the activity log and the notifications once a step is taken.
        # Diagram for the manual: php bin/console workflow:dump finding --dump-format=mermaid
        finding:
            type: state_machine
            audit_trail:
                enabled: false
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\Finding
            initial_marking: reported
            places:
                - reported
                - analysis
                - execution
                - verification
                - closed
                - discarded
            transitions:
                classify_nonconformity:
                    from: reported
                    to: analysis
                classify_other:
                    from: reported
                    to: execution
                discard:
                    from: reported
                    to: discarded
                submit_analysis:
                    from: analysis
                    to: execution
                request_verification:
                    from: execution
                    to: verification
                verify_effective:
                    from: verification
                    to: closed
                verify_ineffective:
                    from: verification
                    to: analysis
                close:
                    from: execution
                    to: closed

        # Life cycle of an internal audit. The marking is the App\Entity\AuditStatus enum; who may
        # take each step, and when, is decided by App\EventSubscriber\AuditWorkflowSubscriber
        # (guards), which also logs each step. Preparing starts on its own when the team first
        # saves the preparation; closing, when every nonconformity it raised is closed (AuditService).
        audit:
            type: state_machine
            audit_trail:
                enabled: false
            marking_store:
                type: method
                property: status
            supports:
                - App\Entity\Audit
            initial_marking: planned
            places:
                - planned
                - preparation
                - in_progress
                - report_issued
                - closed
            transitions:
                prepare:
                    from: planned
                    to: preparation
                start:
                    from: preparation
                    to: in_progress
                issue_report:
                    from: in_progress
                    to: report_issued
                close:
                    from: report_issued
                    to: closed
