; PHP runtime configuration for ÁTICA Calidad (Windows / FrankenPHP)
extension_dir = ext

extension = openssl
extension = intl
extension = pdo_sqlite
extension = sqlite3
extension = mbstring
extension = zip

; Uploads: the per-file limit (20 MB by default) and the total per request
; (100 MB by default) are set in the application (Administración > Ajustes >
; «Subida de ficheros»), but PHP's limits win over them. post_max_size must
; cover the sum of the files (if exceeded, PHP silently discards the whole
; request body, CSRF token included) and upload_max_filesize each file; if the
; application's settings are raised, raise these at the same time.
; On Linux and macOS these values are applied from the Caddyfile (php_ini).
upload_max_filesize = 32M
post_max_size       = 128M
max_file_uploads    = 50
memory_limit        = 256M

; With display_errors on, a PHP warning raised while the request starts (e.g.
; "POST too large") is written before the headers and breaks the session and
; the response (blank page).
display_errors = Off
log_errors     = On
