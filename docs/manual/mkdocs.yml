site_name: Manual de usuario de ÁTICA Calidad
site_description: Gestión documental de apoyo al sistema de gestión de la calidad
# Sustituye por la URL real una vez publicada la web del manual.
site_url: https://TU-USUARIO.github.io/atica-calidad/
# Versión y fecha del release en el pie de la web. Fuente única: config/services.yaml.
# El target "docs-web" del Makefile exporta MANUAL_COPYRIGHT con app.version y
# app.pub_date; al construir directamente con mkdocs (sin la variable) se usa el valor por defecto.
copyright: !ENV [MANUAL_COPYRIGHT, "Manual de usuario de ÁTICA Calidad"]
docs_dir: .
site_dir: ../manual-site
use_directory_urls: false
repo_url: https://github.com/TU-USUARIO/atica-calidad

exclude_docs: |
  README.md
  requirements.txt
  _build.html
  *.pdf

theme:
  name: material
  language: es
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    primary: custom
    accent: custom
  icon:
      repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.integrate

extra_css:
  - assets/theme.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Introducción: index.md
  - Instalación y puesta en marcha: 01-instalacion-y-puesta-en-marcha.md
  - Preparar el curso académico: 02-preparar-el-curso-academico.md
  - Calendario: 03-calendario.md
  - Informes: 04-informes.md
  - Administrar el centro educativo: 05-administrar-el-centro.md
  - Responsabilidades: 06-responsabilidades.md
  - Árbol documental: 07-arbol-documental.md
  - Administrar la plataforma: 08-administrar-la-plataforma.md
  - Permisos de un vistazo: 09-permisos-de-un-vistazo.md
  - 'Anexo: Resolución de problemas': 10-resolucion-de-problemas.md
  - 'Anexo: Glosario': 11-glosario.md
