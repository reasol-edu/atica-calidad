framework:
    html_sanitizer:
        sanitizers:
            app.rich_text:
                allow_safe_elements: false
                max_input_length: 50000
                allow_elements:
                    p: '*'
                    br: '*'
                    strong: '*'
                    b: '*'
                    em: '*'
                    i: '*'
                    u: '*'
                    ol: '*'
                    ul: '*'
                    li: '*'
                    h2: '*'
                    h3: '*'
                    blockquote: '*'
                    a:
                        - href
                force_attributes:
                    a:
                        rel: 'noopener noreferrer'
                allowed_link_schemes:
                    - http
                    - https
                    - mailto
                # `style` is allowed only on the block elements the Tiptap editor's align
                # buttons can write it on, and only ever reaches the page through
                # RichTextAlignAttributeSanitizer (with_attribute_sanitizers below), which keeps
                # nothing but a safe "text-align: …" out of it — the sanitizer itself has no
                # CSS-property-level filtering of its own, so a bare `allow_attributes: style`
                # would let any other declaration (background/url(), position, …) straight through.
                allow_attributes:
                    style:
                        - p
                        - h2
                        - h3
                        - blockquote
                        - li
                drop_attributes:
                    class: '*'
                    id: '*'
                    style:
                        - br
                        - strong
                        - b
                        - em
                        - i
                        - u
                        - ol
                        - ul
                        - a
                with_attribute_sanitizers:
                    - App\HtmlSanitizer\RichTextAlignAttributeSanitizer

            # The running header and footer of the documents (settings and model layout): tables with merged cells and some inline
            # formatting, written by the Tiptap editor. `style` goes through DocLayoutStyleAttributeSanitizer, which keeps only a
            # short list of harmless declarations.
            app.doc_layout:
                allow_safe_elements: false
                max_input_length: 100000
                allow_elements:
                    table: [style]
                    colgroup: []
                    col: [style]
                    thead: []
                    tbody: []
                    tfoot: []
                    tr: []
                    td: [style, colspan, rowspan, data-colwidth]
                    th: [style, colspan, rowspan, data-colwidth]
                    p: [style]
                    br: []
                    strong: []
                    b: []
                    em: []
                    i: []
                    u: []
                    s: []
                    span: [style]
                with_attribute_sanitizers:
                    - App\HtmlSanitizer\DocLayoutStyleAttributeSanitizer
