; ── OPcache ────────────────────────────────────────────────────────────────
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 256
opcache.max_accelerated_files  = 20000
; Sin recarga automática en producción (cambiar a 1 durante desarrollo)
opcache.validate_timestamps    = 0
realpath_cache_size            = 4096K
realpath_cache_ttl             = 600

; ── Límites ────────────────────────────────────────────────────────────────
memory_limit          = 256M
upload_max_filesize   = 32M
; El límite por fichero (20 MB por defecto) y el total por envío (100 MB por
; defecto) se configuran en la aplicación (Administración > Ajustes > «Subida
; de ficheros»), pero los de PHP mandan por encima de ellos. post_max_size debe
; cubrir la suma de los ficheros (si se supera, PHP descarta todo el cuerpo de
; la petición, token CSRF incluido) y upload_max_filesize cada fichero; si se
; suben los ajustes de la aplicación, hay que subir estos valores a la vez.
post_max_size         = 128M
max_file_uploads      = 50
max_execution_time    = 60

; ── Errores (producción) ───────────────────────────────────────────────────
display_errors  = Off
log_errors      = On
