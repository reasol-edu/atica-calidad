# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
# Overrides for the test environment only. Loaded after services.yaml,
# so it takes precedence over the default autowiring of App\.
when@test:
    parameters:
        # In tests, the anti-timing padding for the password reset is disabled
        # to avoid adding ~900 ms to every POST to /contrasena/recuperar.
        app.password_reset.request_min_duration_us: 0
