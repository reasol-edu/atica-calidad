settings.key.forms_document_header.label: 'Encabezado de los documentos'
settings.key.forms_document_header.description: 'Se repite en lo alto de cada página de los modelos de documento (PDF, Word y LibreOffice). Admite tablas y estos campos: {centro}, {localidad}, {logo}, {logo2}, {pagina}, {paginas}, {codigo}, {titulo}, {revision}, {fecha_revision} y {fecha_aprobacion}. Cada modelo puede personalizar el suyo.'
settings.key.forms_document_footer.label: 'Pie de los documentos'
settings.key.forms_document_footer.description: 'Se repite al pie de cada página de los modelos de documento. Admite los mismos campos que el encabezado. Cada modelo puede personalizar el suyo.'
settings.key.centre_logo.label: 'Logotipo del centro'
settings.key.centre_logo.description: 'Imagen PNG o JPEG (hasta 2 MB) que aparece donde el encabezado o el pie de los documentos tengan el campo {logo}. Si el centro no sube la suya, se usa la de la plataforma.'
settings.key.centre_education_authority_logo.label: 'Logotipo de la administración educativa'
settings.key.centre_education_authority_logo.description: 'El de la administración de la que depende el centro (por ejemplo, la Junta de Andalucía). Aparece donde el encabezado o el pie tengan el campo {logo2}. Si el centro no sube el suyo, se usa el de la plataforma.'
settings.key.forms_margin_top.label: 'Margen superior de los documentos (mm)'
settings.key.forms_margin_top.description: 'Distancia del borde del papel al encabezado. El contenido empieza debajo del encabezado, sea cual sea su altura. Cada modelo puede cambiarla.'
settings.key.forms_margin_bottom.label: 'Margen inferior de los documentos (mm)'
settings.key.forms_margin_bottom.description: 'Distancia del borde del papel al pie de página. Cada modelo puede cambiarla.'
