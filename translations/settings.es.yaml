# ── Definiciones de ajustes ───────────────────────────────────────────────────
settings.key.page_size.label: 'Resultados por página'
settings.key.page_size.description: 'Número de elementos que se muestran en los listados.'

settings.key.notifications_email_log_enabled.label: 'Registrar los avisos por correo'
settings.key.notifications_email_log_enabled.description: 'Guarda un registro de cada aviso por correo enviado (destinatario, tipo de evento, asunto y resultado), visible en el hub de centro educativo.'

settings.key.notifications_log_retention_days.label: 'Retención de los registros'
settings.key.notifications_log_retention_days.description: 'Días que se conservan las entradas del registro de avisos por correo antes de eliminarse automáticamente. Un valor de 0 desactiva esta eliminación automática.'

settings.key.audit_log_enabled.label: 'Registrar la actividad de los usuarios'
settings.key.audit_log_enabled.description: 'Guarda un registro de auditoría de lo que hace cada usuario de este centro (a qué accede, qué crea, modifica, descarga, sube o marca como completado) y desde qué IP. El registro completo se consulta en Administración → Registro de actividad. Los eventos sin centro (inicios y cierres de sesión) se rigen por el valor global de este ajuste.'

settings.key.audit_log_retention_days.label: 'Retención del registro de actividad'
settings.key.audit_log_retention_days.description: 'Días que se conservan las entradas del registro de actividad antes de eliminarse automáticamente. Un valor de 0 desactiva esta eliminación automática.'

settings.key.quality_verification_days.label: 'Días hasta la verificación de eficacia'
settings.key.quality_verification_days.description: 'Cuando se terminan todas las acciones de una no conformidad, días que se dejan pasar antes de comprobar si han sido eficaces. Es la fecha que se propone a la persona responsable de calidad; puede verificarse antes.'

settings.key.quality_measurement_days.label: 'Días para registrar el valor de un indicador'
settings.key.quality_measurement_days.description: 'Desde que termina un periodo de medición, días que tiene su responsable para registrar el valor antes de que conste como «Sin dato».'

settings.key.notifications_quality_notifications_enabled.label: 'Avisos de Mejora continua'
settings.key.notifications_quality_notifications_enabled.description: 'Avisa por correo cuando te toca algo en Mejora continua (clasificar, analizar, hacer una acción, verificar) y cuando se resuelve una incidencia que comunicaste.'

settings.key.uploads_max_file_size_mb.label: 'Tamaño máximo por fichero (MB)'
settings.key.uploads_max_file_size_mb.description: 'Tamaño máximo de cada fichero que se sube (documentos, entregas de actividades, adjuntos de Mejora continua, plantillas PDF e importaciones). No puede superar el límite de PHP del servidor (upload_max_filesize): si éste es menor, prevalece y los avisos muestran el máximo real.'
settings.key.uploads_max_total_size_mb.label: 'Tamaño máximo total por envío (MB)'
settings.key.uploads_max_total_size_mb.description: 'Suma máxima de los ficheros que se suben en un mismo envío del formulario. No puede superar el límite de PHP del servidor (post_max_size): si éste es menor, prevalece.'

settings.key.trash_retention_days.label: 'Días en la papelera'
settings.key.trash_retention_days.description: 'Días que se conservan en la papelera los documentos y las actividades eliminados antes de borrarse para siempre. Un valor de 0 desactiva el vaciado automático: solo se borran a mano desde la papelera.'

settings.key.notifications_email_notifications_enabled.label: 'Avisos por correo electrónico'
settings.key.notifications_email_notifications_enabled.description: 'Activa el envío de avisos por correo electrónico a los profesores.'

settings.key.notifications_pending_activity_reminder_enabled.label: 'Recordatorio de actividad pendiente de completar'
settings.key.notifications_pending_activity_reminder_enabled.description: 'Envía un recordatorio cuando una actividad esté pendiente de completar. Incluye también las tareas de Mejora continua con plazo (acciones, análisis de causas, verificaciones), salvo que estén desactivados los avisos de Mejora continua.'

settings.key.notifications_pending_activity_reminder_warning_days.label: 'Días de preaviso del recordatorio'
settings.key.notifications_pending_activity_reminder_warning_days.description: 'Días de antelación sobre la fecha límite a partir de los cuales se avisa de una actividad pendiente de completar (además de las que ya estén fuera de plazo).'

settings.key.notifications_pending_review_notification_mode.label: 'Aviso de documento pendiente de revisar'
settings.key.notifications_pending_review_notification_mode.description: 'Avisa a los perfiles de revisión de una carpeta cuando se suba una versión de un documento que necesite su revisión.'
settings.key.notifications_pending_review_notification_mode.choice.disabled: 'Desactivado'
settings.key.notifications_pending_review_notification_mode.choice.individual: 'Individual'
settings.key.notifications_pending_review_notification_mode.choice.daily_digest: 'Resumen diario'

settings.key.notifications_document_accepted_notification_mode.label: 'Aviso de documento aceptado'
settings.key.notifications_document_accepted_notification_mode.description: 'Avisa a los perfiles de subida de una carpeta (o al docente que la subió, si la actividad es de ámbito individual) cuando se acepte una de sus revisiones.'
settings.key.notifications_document_accepted_notification_mode.choice.disabled: 'Desactivado'
settings.key.notifications_document_accepted_notification_mode.choice.individual: 'Individual'
settings.key.notifications_document_accepted_notification_mode.choice.daily_digest: 'Resumen diario'

settings.key.notifications_document_rejected_notification_mode.label: 'Aviso de documento rechazado'
settings.key.notifications_document_rejected_notification_mode.description: 'Avisa a los perfiles de subida de una carpeta (o al docente que la subió, si la actividad es de ámbito individual) cuando se rechace una de sus revisiones.'
settings.key.notifications_document_rejected_notification_mode.choice.disabled: 'Desactivado'
settings.key.notifications_document_rejected_notification_mode.choice.individual: 'Individual'
settings.key.notifications_document_rejected_notification_mode.choice.daily_digest: 'Resumen diario'

settings.key.notifications_document_next_review_reminder_enabled.label: 'Recordatorio de revisión de documentos'
settings.key.notifications_document_next_review_reminder_enabled.description: 'Envía, una vez por semana (el primer día lectivo), la lista de documentos de las carpetas a tu cargo con la fecha de próxima revisión vencida o cerca. Si una carpeta no tiene responsables, lo reciben las personas responsables de calidad del centro.'

settings.key.notifications_document_next_review_reminder_warning_days.label: 'Días de preaviso de la revisión de documentos'
settings.key.notifications_document_next_review_reminder_warning_days.description: 'Con cuántos días de antelación sobre la fecha de próxima revisión empieza a incluirse un documento en el recordatorio (además de los ya vencidos).'

settings.key.notifications_email_subject_prefix.label: 'Prefijo del asunto'
settings.key.notifications_email_subject_prefix.description: 'Texto que se antepone al asunto de cada aviso por correo electrónico, seguido automáticamente de un espacio (p. ej. «[ÁTICA]» da como resultado «[ÁTICA] Asunto original»). Vacío por defecto: no se añade ningún prefijo.'

settings.key.academic_year_start_date.label: 'Inicio del curso académico'
settings.key.academic_year_start_date.description: 'Día y mes en que empieza cada curso académico (15 de septiembre por defecto). Las actividades se repiten cada curso en sus fechas, y este día marca cuándo pasan a contar las del curso siguiente: p. ej., una actividad de enero a febrero, consultada en octubre, se refiere a la del próximo enero, no a la del enero ya pasado.'

settings.key.documents_min_revision.label: 'Número mínimo de revisión de un documento'
settings.key.documents_min_revision.description: 'Con 1, la primera revisión de un documento es la «v1»; con 0, es la «v0» y la siguiente la «v1», como numeran la edición inicial muchos sistemas de calidad. Es el número que se propone al subir un documento nuevo y el mínimo que admiten los campos de versión; los documentos que ya existen no cambian. 1 por defecto.'
settings.key.documents_min_revision.choice.0: '0'
settings.key.documents_min_revision.choice.1: '1'
settings.key.search_ocr.label: 'Leer el texto de los documentos escaneados (OCR)'
settings.key.search_ocr.description: 'Con «Activado», el proceso de segundo plano lee con OCR los PDF escaneados y las imágenes (PNG, JPEG, TIFF) para que se pueda buscar dentro de ellos. Es opcional y necesita instalar Tesseract y poppler-utils en el servidor (la imagen Docker ya los trae; ver el manual de administración). Sin esas herramientas no ocurre nada y los escaneos se siguen encontrando solo por su nombre. Lee unas pocas páginas cada dos minutos, así que un documento muy largo tarda en estar listo. Desactivado por defecto.'
settings.key.search_ocr.choice.off: 'Desactivado'
settings.key.search_ocr.choice.on: 'Activado'
settings.key.backup_auto_policy.label: 'Copias automáticas'
settings.key.backup_auto_policy.description: 'Si la aplicación guarda una copia de seguridad cada noche (02:30) en el servidor y cuántas conserva. Se guarda siempre una copia al día; con el tiempo se van borrando las antiguas, dejando una por semana y una por mes, para poder volver atrás si un problema se descubre tarde. Básica: 7 diarias. Recomendada: 7 diarias, 4 semanales y 3 mensuales (unos 3 meses atrás). Ampliada: 14 diarias, 8 semanales y 12 mensuales (hasta un año atrás). Las copias que guardas a mano nunca se borran. Cada copia ocupa lo que la base de datos, ficheros incluidos, y se guarda sin cifrar en el mismo disco: no sustituye a una copia fuera del servidor.'
settings.key.backup_auto_policy.choice.off: 'Desactivadas'
settings.key.backup_auto_policy.choice.basic: 'Básica'
settings.key.backup_auto_policy.choice.recommended: 'Recomendada'
settings.key.backup_auto_policy.choice.extended: 'Ampliada'
settings.key.backup_auto_max_size_mb.label: 'Espacio máximo de las copias automáticas (MB)'
settings.key.backup_auto_max_size_mb.description: 'Espacio que pueden ocupar, entre todas, las copias automáticas. Si se supera, se borran las más antiguas hasta que quepan; la más reciente se conserva siempre, aunque ella sola ocupe más. Un valor de 0 significa sin límite de espacio (solo cuenta la política de copias elegida).'
settings.key.maintenance_enabled.label: 'Modo mantenimiento'
settings.key.maintenance_enabled.description: 'Con el modo mantenimiento activado, solo los administradores globales pueden usar la aplicación: el resto del profesorado, esté o no con la sesión iniciada, ve una página de mantenimiento. Los avisos por correo y las demás tareas automáticas siguen funcionando.'

settings.key.security_idle_timeout_minutes.label: 'Cierre de sesión por inactividad'
settings.key.security_idle_timeout_minutes.description: 'Minutos sin actividad tras los que se cierra la sesión de un docente, para que un equipo compartido que se deja abierto no quede utilizable por otra persona. 0 lo desactiva. 120 por defecto.'

settings.key.reports_pdf_template_portrait.label: 'Plantilla PDF general (vertical)'
settings.key.reports_pdf_template_portrait.description: 'PDF de una sola página que se usa como fondo de cada página de los informes en orientación vertical que no tengan una plantilla propia. Si no se sube ninguna, esos informes se generan sin fondo.'

settings.key.reports_pdf_template_landscape.label: 'Plantilla PDF general (apaisada)'
settings.key.reports_pdf_template_landscape.description: 'PDF de una sola página que se usa como fondo de cada página de los informes en orientación apaisada que no tengan una plantilla propia. Si no se sube ninguna, esos informes se generan sin fondo.'

