name: Build ejecutables standalone

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del build (p.ej. 1.2.3)"
        required: true
        default: "dev"

env:
  # Actualizar cuando salga una nueva versión estable de FrankenPHP
  # https://github.com/php/frankenphp/releases
  # El binario lleva dentro su propio PHP (desde la 1.13.1, PHP 8.5.12, que corrige PHP2Shell,
  # CVE-2026-109618 y CVE-2026-109619): cada versión de FrankenPHP trae el PHP con el que se compiló,
  # así que hay que subirla también cuando salga un parche de seguridad de PHP. NO bajar de la 1.13.1:
  # las anteriores llevan PHP con PHP2Shell.
  # La 1.13.2 no sirve: sus binarios estáticos de Linux se compilaron para la CPU del servidor de CI y
  # mueren con SIGILL (status=4/ILL) en CPUs sin SHA-NI al llamar a hash('sha256')
  # (https://github.com/php/frankenphp/issues/2743). Corregido en la 1.13.3 (PR #2749).
  # Desde la 1.13.2 no se publica binario para Mac con procesador Intel (la 1.13.1 sí lo publicaba).
  # La 1.13.4 es de seguridad: corrige un fallo de la 1.13.2 y la 1.13.3 que tumbaba el proceso con
  # una sola petición sin autenticar en modo worker, varios use-after-free y fugas entre peticiones,
  # y trae Brotli parcheado (CVE-2026-111497) y Go 1.27.3 en los binarios de Windows y macOS.
  FRANKENPHP_VERSION: "1.13.4"
  # Solo para compilar la aplicación (composer, assets); el PHP que ejecuta la app es el del binario.
  PHP_VERSION: "8.4"

# ── Job 1: compilar la aplicación PHP una sola vez ───────────────────────────
jobs:
  build-app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: intl, pdo_sqlite, zip, mbstring, ctype, dom, iconv, libxml
          coverage: none

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias PHP (producción)
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-scripts \
            --no-autoloader \
            --no-interaction
          composer dump-autoload \
            --optimize \
            --no-dev \
            --classmap-authoritative

      - name: Compilar assets
        env:
          APP_ENV: prod
          APP_DEBUG: "0"
          DATABASE_URL: "sqlite:////tmp/ci-build.db"
          APP_SECRET: "ci-placeholder-secret-0000000000000000"
        run: |
          php bin/console importmap:install
          php bin/console tailwind:build --minify
          php bin/console asset-map:compile

      - name: Preparar bundle de la aplicación
        run: |
          mkdir -p /tmp/app-bundle
          cp -r \
            assets bin config migrations public src templates translations vendor \
            composer.json importmap.php symfony.lock \
            /tmp/app-bundle/
          mkdir -p /tmp/app-bundle/var

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-bundle
          path: /tmp/app-bundle
          retention-days: 1

# ── Job 2: empaquetar por plataforma ─────────────────────────────────────────
  package:
    needs: build-app
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # fp_sha256: suma del binario de FrankenPHP (versión de FRANKENPHP_VERSION), fijada aquí
          # para que un cambio en el binario publicado rompa la build en vez de entrar en los
          # paquetes. Al subir de versión, actualízalas todas con:
          #   gh api repos/php/frankenphp/releases/tags/v<versión> --jq '.assets[] | "\(.name) \(.digest)"'
          # FrankenPHP vuelve a subir los binarios de una versión ya publicada, porque los reconstruye
          # cuando se actualizan las bibliotecas de C (php/frankenphp#2761, a propósito): si la build
          # falla aquí con «FAILED», no es un fallo del repositorio. Comprueba las sumas de nuevo con
          # el comando de arriba (y, si quieres estar seguro, descarga y calcula `shasum -a 256`) y
          # vuelve a fijarlas justo antes de etiquetar.
          - platform: linux-x86_64
            fp_asset:   frankenphp-linux-x86_64
            fp_sha256:  5c33da36b76a9173200ce0d49356aee013473be149ee3df6c38fd6e2b5a0e580
            binary:     frankenphp
            archive:    tar.gz
          - platform: linux-aarch64
            fp_asset:   frankenphp-linux-aarch64
            fp_sha256:  2957e4a99592169aa136ec492e849f1ce591d3e9e216cd7713165c42656656e0
            binary:     frankenphp
            archive:    tar.gz
          # Sin binario para Mac con procesador Intel: FrankenPHP solo lo publica para Apple Silicon desde la 1.13.2.
          - platform: macos-arm64
            fp_asset:   frankenphp-mac-arm64
            fp_sha256:  660e802d87762361282e274ddca5e2d67344247673bc452353eaaf0aa5cce393
            binary:     frankenphp
            archive:    tar.gz
          - platform: windows-x86_64
            fp_asset:   frankenphp-windows-x86_64.zip
            fp_sha256:  d2873471e918e762ff4207c6e403fcacc0083ea6c5165512107215e4d2576ace
            binary:     frankenphp.exe
            archive:    zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1   # necesario para dist/

      - name: Descargar bundle de la aplicación
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-bundle
          path: _app

      - name: Determinar versión
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version || 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar binario FrankenPHP (${{ matrix.platform }})
        run: |
          curl -fsSL \
            "https://github.com/php/frankenphp/releases/download/v${{ env.FRANKENPHP_VERSION }}/${{ matrix.fp_asset }}" \
            -o fp_asset_download
          echo "${{ matrix.fp_sha256 }}  fp_asset_download" | sha256sum -c -
          if [[ "${{ matrix.fp_asset }}" == *.zip ]]; then
            unzip fp_asset_download -d fp_extracted
          else
            mkdir -p fp_extracted
            mv fp_asset_download "fp_extracted/${{ matrix.binary }}"
            chmod +x "fp_extracted/${{ matrix.binary }}"
          fi

      - name: Ensamblar paquete
        env:
          PKG: atica-calidad-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
        run: |
          mkdir -p "${PKG}/data"
          cp -r _app "${PKG}/app"
          cp dist/Caddyfile "${PKG}/Caddyfile"
          echo "${{ steps.ver.outputs.version }}" > "${PKG}/.version"

          if [[ "${{ matrix.platform }}" == windows* ]]; then
            # Copiar frankenphp.exe + todas las DLLs del raíz del ZIP
            find fp_extracted -maxdepth 1 \( -name "frankenphp.exe" -o -name "*.dll" \) \
              -exec cp {} "${PKG}/" \;
            # Extensiones PHP (ext/) y soporte SSL (extras/)
            cp -r fp_extracted/ext     "${PKG}/ext"
            cp -r fp_extracted/extras  "${PKG}/extras"
            cp dist/php.ini   "${PKG}/php.ini"
            cp dist/start.bat "${PKG}/start.bat"
            cp dist/start.ps1 "${PKG}/start.ps1"
            cp dist/demo.bat  "${PKG}/demo.bat"
            cp dist/demo.ps1  "${PKG}/demo.ps1"
          else
            cp "fp_extracted/${{ matrix.binary }}" "${PKG}/${{ matrix.binary }}"
            chmod +x "${PKG}/${{ matrix.binary }}"
            cp dist/start.sh "${PKG}/start.sh"
            chmod +x "${PKG}/start.sh"
            cp dist/demo.sh "${PKG}/demo.sh"
            chmod +x "${PKG}/demo.sh"
            # macOS: lanzador de demostración abrible con doble clic en el Finder
            if [[ "${{ matrix.platform }}" == macos* ]]; then
              cp dist/demo.command "${PKG}/demo.command"
              chmod +x "${PKG}/demo.command"
            fi
          fi

          echo "PKG=${PKG}" >> "$GITHUB_ENV"

      - name: Crear archivo tar.gz
        if: matrix.archive == 'tar.gz'
        run: tar czf "${PKG}.tar.gz" "${PKG}"

      - name: Crear archivo zip
        if: matrix.archive == 'zip'
        run: zip -r "${PKG}.zip" "${PKG}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atica-calidad-${{ matrix.platform }}
          path: atica-calidad-*.${{ matrix.archive }}

# ── Job 3: generar la documentación (manual, presentación y web) ─────────────
  docs:
    runs-on: ubuntu-latest
    outputs:
      deploy_pages: ${{ steps.stable.outputs.deploy }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # todos los tags para calcular el estable más alto

      - name: ¿Tag estable e igual o más nuevo?
        id: stable
        run: |
          REF="${{ github.ref_name }}"
          if [[ "${{ github.ref_type }}" != "tag" ]] || [[ "$REF" == *-* ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Despliega si REF es igual o más nuevo que cualquier otra versión
          # estable; es decir, no existe ninguna etiqueta estable estrictamente
          # superior (permite re-publicar la misma versión).
          NEWER=$(git tag --list 'v*' | grep -vE '[-]' | sort -V \
                    | awk -v r="$REF" 'found {print} $0 == r {found=1}')
          if [[ -z "$NEWER" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Instalar pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Instalar MkDocs Material
        run: pip install -r docs/manual/requirements.txt

      - name: Determinar versión
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version || 'dev' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar manual, presentación y web
        env:
          # Reutiliza el Chrome preinstalado del runner para pagedjs-cli y marp-cli
          # (evita descargar un Chromium aparte).
          CHROME_PATH: /usr/bin/google-chrome
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: make slides docs-pdf docs-web cheatsheets

      - name: Ensamblar activos con sufijo de versión
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p _docs-dist
          cp docs/manual/atica-calidad-manual.pdf "_docs-dist/atica-calidad-manual-${VERSION}.pdf"
          cp docs/slides/atica-calidad.pdf        "_docs-dist/atica-calidad-presentacion-${VERSION}.pdf"
          (cd docs/manual-site && zip -r "../../_docs-dist/atica-calidad-manual-web-${VERSION}.zip" .)
          for f in docs/cheatsheets/ficha-*.pdf; do
            name=$(basename "$f" .pdf)
            cp "$f" "_docs-dist/atica-calidad-${name}-${VERSION}.pdf"
          done
          (cd _docs-dist && zip "atica-calidad-documentacion-${VERSION}.zip" ./*.pdf)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atica-calidad-docs
          path: _docs-dist/*

      - name: Subir artefacto de Pages (solo última versión estable)
        if: steps.stable.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/manual-site

# ── Job 4: crear release en GitHub (solo para tags) ──────────────────────────
  release:
    if: github.ref_type == 'tag'
    needs: [package, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1   # necesario para dist/update-ubuntu.sh

      - name: Descargar todos los artefactos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: atica-calidad-*
          merge-multiple: true

      # Sumas SHA256 de todo lo que se publica y del script de actualización: update-ubuntu.sh e
      # install-ubuntu.sh no instalan ni se renuevan sin comprobar contra este fichero. El script
      # se publica como asset de la release (en vez de leerse de la rama main) para que a los
      # servidores solo llegue lo que se ha publicado.
      - name: Preparar el script de actualización y las sumas de verificación
        run: |
          cp dist/update-ubuntu.sh update-ubuntu.sh
          sha256sum atica-calidad-*.tar.gz atica-calidad-*.zip update-ubuntu.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            SHA256SUMS
            update-ubuntu.sh
            atica-calidad-*.tar.gz
            atica-calidad-*.zip
            atica-calidad-manual-*.pdf
            atica-calidad-presentacion-*.pdf
            atica-calidad-ficha-*.pdf
            atica-calidad-manual-web-*.zip
            atica-calidad-documentacion-*.zip
          # body: " " (un espacio, no "") es intencional: la acción calcula
          # `body = workflowBody || existingReleaseBody`, y en JS "" es
          # falsy, así que un body vacío seguía cayendo al body del release
          # anterior (que ya incluía el "Full Changelog" del run previo) y
          # generate_release_notes lo anteponía de nuevo en cada rerelease.
          # Un espacio es "truthy" y evita ese fallback.
          body: " "
          generate_release_notes: true

# ── Job 5: publicar la web en GitHub Pages (solo última versión estable) ─────
  deploy-pages:
    needs: docs
    if: needs.docs.outputs.deploy_pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
