<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1a2415;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#46603d;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1a2415" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Fondo cuadrado redondeado -->
    <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

    <!-- Hoja de salvia decorativa de fondo -->
    <path d="M110,430 C146,250 236,106 416,70 C380,214 344,340 200,430 C308,412 380,340 416,232 M263,250 L182,304"
          fill="none" stroke="#c7d8bc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.16"/>

    <!-- Documento asomando tras la carpeta -->
    <g transform="rotate(-6 282 170)">
        <rect x="192" y="104" width="180" height="132" rx="16" ry="16" fill="#e3ebdd"/>
        <rect x="214" y="134" width="108" height="10" rx="5" ry="5" fill="#8fab74" opacity="0.7"/>
        <rect x="214" y="156" width="76" height="10" rx="5" ry="5" fill="#8fab74" opacity="0.5"/>
        <rect x="214" y="178" width="92" height="10" rx="5" ry="5" fill="#8fab74" opacity="0.35"/>
    </g>

    <!-- Pestaña y cuerpo de la carpeta -->
    <rect x="150" y="178" width="110" height="34" rx="14" ry="14" fill="#c7d8bc"/>
    <rect x="150" y="204" width="232" height="180" rx="20" ry="20" fill="#f3f6f0"/>
    <rect x="150" y="228" width="232" height="6" rx="3" ry="3" fill="#c7d8bc" opacity="0.35"/>

    <!-- Sello de calidad con cintas, en la esquina inferior derecha -->
    <path d="M320,330 L296,414 L316,398 L332,414 L340,336 Z" fill="#6e8c63"/>
    <path d="M372,330 L398,414 L378,398 L362,414 L352,336 Z" fill="#5a7550"/>
    <circle cx="346" cy="336" r="46" fill="#1a2415"/>
    <circle cx="346" cy="336" r="46" fill="none" stroke="#c7d8bc" stroke-width="3" opacity="0.4"/>
    <path d="M326 336 L342 352 L370 320" stroke="#f3f6f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
