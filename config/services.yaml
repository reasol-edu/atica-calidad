# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Application version
    app.name:                   "ÁTICA Calidad"
    app.version:                "1.27.1"
    app.pub_date:               "2026-11-13"
    # Zona horaria de la aplicación (la que ven las personas y la de «hoy», los plazos y los avisos). Las fechas con hora
    # siguen guardándose en UTC; ver App\Doctrine\Type\UtcDateTimeImmutableType. Se cambia con APP_TIMEZONE.
    env(APP_TIMEZONE):          "Europe/Madrid"
    app.timezone:               "%env(APP_TIMEZONE)%"
    # Carpeta de las copias de seguridad guardadas en el servidor (la que usa también «app:backup»). Tiene que sobrevivir a las
    # actualizaciones: en Docker, var/ es un volumen; en el binario nativo, dist/start.* la apunta a data/backups.
    env(APP_BACKUP_DIR):        "%kernel.project_dir%/var/backups"
    app.backup_dir:             "%env(APP_BACKUP_DIR)%"
    # Estado de una restauración (bloqueo, resultado y hora de la última): ficheros, no base de datos, porque es la base de
    # datos lo que se sustituye. Debe ser común a todos los procesos de la aplicación (web, consola y worker).
    app.restore_state_dir:      "%kernel.project_dir%/var/restore"
    # Minimum time (in microseconds) the POST branch of the password-reset
    # request takes. Equalizes the two branches (user exists / does not
    # exist) so that the synchronous email send doesn't allow account
    # enumeration by timing. Overridden in the test environment (services_test.yaml).
    app.password_reset.request_min_duration_us: 900000

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones



