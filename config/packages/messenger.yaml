framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'   # doctrine://default?auto_setup=0
                retry_strategy:
                    max_retries: 3
                    delay: 30000
                    multiplier: 4
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            sync: 'sync://'

        routing:
            # Emails (email verification, tutoring/signature notifications) are
            # sent in the background. Password reset does NOT use the bus: it is sent
            # synchronously via TransportInterface because it's urgent (1-hour token).
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async
            # Reading a stored file's text for the search is slow and must never run inside the upload request.
            'App\Message\IndexDocumentFileMessage': async

when@test:
    framework:
        messenger:
            routing:
                'Symfony\Component\Mailer\Messenger\SendEmailMessage': sync
                # Inline, so a test that uploads a file can search it straight away; the indexer writes through plain SQL and
                # leaves the request's unit of work alone.
                'App\Message\IndexDocumentFileMessage': sync
